<script>
(function(){
  // Link de destino (galeria / bot telegram / privacy)
  var DEST = "https://phantoms.group/b/milenapnk";
  var PASS = true;
  var went = false;

  // Monta a URL preservando UTMs e parâmetros originais
  function finalUrl(){
    try {
      var u = new URL(DEST);
      if (PASS) {
        new URLSearchParams(location.search).forEach(function(v, k){
          if (!u.searchParams.has(k)) u.searchParams.set(k, v);
        });
      }
      return u.toString();
    } catch(e) {
      return DEST;
    }
  }

  // Executa o redirecionamento
  window.goPresell = function(){
    if (went) return;
    went = true;
    try {
      if (window.ttq) ttq.track("ClickButton");
    } catch(e){}
    
    var loader = document.getElementById("redirectingScreen");
    if (loader) loader.style.display = "flex";

    var target = finalUrl();
    setTimeout(function(){
      window.location.replace(target);
    }, 150);
  };

  // Identificação heurística do navegador interno do TikTok
  function isTikTokBrowser(){
    var ua = (navigator.userAgent || navigator.vendor || window.opera || "").toLowerCase();
    
    // Identificadores diretos do TikTok (iOS e Android)
    var isTikTok = ua.indexOf("musical_ly") > -1 ||
                   ua.indexOf("tiktok") > -1 ||
                   ua.indexOf("bytedance") > -1 ||
                   ua.indexOf("bytefullconfig") > -1 ||
                   ua.indexOf("bytelocale") > -1;

    // WebView genérica dentro de apps no Android/iOS
    var isWebView = (ua.indexOf("; wv") > -1 || ua.indexOf("webview") > -1) && (ua.indexOf("android") > -1);

    return isTikTok || isWebView;
  }

  // Lógica de inicialização da página
  function init(){
    var inTikTok = isTikTokBrowser();

    if (inTikTok) {
      // CENÁRIO A: Ainda no navegador do TikTok
      // Exibe tutorial e seta normalmente
      var arrow = document.getElementById("topArrow");
      if (arrow) arrow.style.display = "block";
    } else {
      // CENÁRIO B: Saiu do TikTok e abriu no navegador externo (Chrome, Safari, etc.)
      // Redireciona imediatamente sem nenhum clique ou confirmação
      var arrow = document.getElementById("topArrow");
      if (arrow) arrow.style.display = "none";
      window.goPresell();
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
